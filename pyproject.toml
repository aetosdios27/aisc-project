[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "othello-ai"
version = "0.1.0"
description = "Controlled comparisons of Othello position evaluators"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
research = ["torch>=2.4", "matplotlib>=3.8"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["engine*", "evolution*", "neural*", "experiments*", "api*"]
